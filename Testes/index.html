<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!------------------------------------------ área cabeçalho ---------------------------------------------->
    <header>
        <!---------------------------------------- logo da empresa ou nome ---------------------------------->
        <nav class="navbar-nav navbar-expand-sm navbar-dark bg-dark">
            <div class="container">
                    <a class="navbar-brand" href="#">Meu Site</a>
                    <!--  menu de navegação  -->
                    <div class="navbar-nav ms-auto gap-2 align-items-center">
                        <a class="nav-link active" href="#">Home</a>
                        <a class="nav-link" href="#">Sobre</a>
                        <a class="nav-link" href="#">Serviços</a>
                        <a class="nav-link" href="#">Contato</a>
                    </div>
            </div>
        </nav>
    </header>

     <!---------------------------------------------------------- 
     card 
     irá representar o conteúdo principal
     m - adiciona margem no elemento 
     p - adiciona padding no elemento
     w - adiciona uma largura ao elemento
     mx-auto - coloca margin automatica
     shadow - coloca sombra
     img-fluid - faz a imagem ocupar toda a largura da div
     border - adiciona uma borda ao elemento
     --------------------------------------------------------->
     <main>
         <div class="container">
             <div class="w-75 mx-auto p-4 rounded-4 shadow-sm bg-light">
                 <img src="https://picsum.photos/800/300" class="img-fluid rounded-top-3 w-100">
                 <div class="mt-0 p-3 bg-white border-secondary rounded--bottom-2">
                     <p>Esse elemento possui arredondamento, margem e preenchimento</p>
                    </div>
                </div>
            </div>
        </main>

        <main>
         <div class="container">
             <div class="w-75 mx-auto p-4 rounded-4 shadow-sm bg-light">
                 <img src="https://picsum.photos/800/300" class="img-fluid rounded-top-3 w-100">
                 <div class="mt-0 p-3 bg-white border-secondary rounded--bottom-2">
                     <p>Esse elemento possui arredondamento, margem e preenchimento</p>
                    </div>
                </div>
            </div>
        </main>
    <!-------------------------------------------------------------------------------------- 
    * area de rodape *
    bg-dark - fundo preto
    text-white - cor do texto pra branco
    py - preenchimento e embaixo
    container - cria uma caixa com margem e preenchimento nas laterais do conteúdo
    d-flex - torna os elementos flexíveis e adiciona herança
    flex-column - coloca os elementos em colunas (so funciona se o container for flexível)
    flex-row - coloca os elementos um abaixo do outro
    justify-content - faz o alinhamento do eixo principal
    align-itens - faz o alinhamento no eixo vertical
    gap - coloca os espaços entre os elementos
    text-decoration-none - tira o visual do link
    ---------------------------------------------------------------------------------------->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-lg-between align-items-center gap-3">
                <p>&copy; 2026 Meu Site. Todos direitos reservados.</p>
                <nav class="d-flex gap-3">
                    <a class="text-decoration-none text-white" href="#">Termos de uso</a>
                    <a class="text-decoration-none text-white" href="#">Privacidade</a>
                    <a class="text-decoration-none text-white" href="#">Suporte</a>
                </nav>
            </div>

        </div>
    </footer>

</body>
</html>
