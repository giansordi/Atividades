<head>
<meta charset="utf-8">
    <title> Formulário </title>

</head>



<body>
    <form>
    
        <label> 
            Nome:   <input style="width:30%" type="text"> 
        </label>
    <br>
    <label> 
        Idade:   <input style="width:30%" type="number" min="0" max="5"> 
    </label>
    
    <br>
    <label>
     Data de Nascimento:   <input type="date">
    </label>
    <br>
    
    <label>
        Escolha de Opções: <br>
        <input type="radio" name="escolha"> Escolha 1 <br>
        <input type="radio" name="escolha"> Escolha 2 <br>
        <input type="radio" name="escolha"> Escolha 3 <br>
    </label>
    
    
    <label>
        Escolha de Multipla: <br>
        <input type="checkbox" name="multipla"> Escolha 1 <br>
        <input type="checkbox" name="multipla"> Escolha 2 <br>
        <input type="checkbox" name="multipla"> Escolha 3 <br>
    </label>
    
    <label>
        Textarea <br> <textarea> </textarea>
    </label>
<br><br>

    <input type="reset">

    <input type="submit">
    
</form>
</body>
